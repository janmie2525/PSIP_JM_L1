
name: Destroy Remote Database

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Srodowisko do usuniecia"
        required: true
        default: env-test
        type: choice
        options:
          - env-test
          - env-qa
          - main
      confirmation:
        description: "Wpisz USUN, aby potwierdzic usuniecie danych"
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy-db:
    runs-on: self-hosted
    if: ${{ inputs.confirmation == 'USUN' }}

    environment:
      name: ${{ inputs.target_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_environment }}

      - name: Destroy PostGIS and database volume
        shell: pwsh
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          $project = "remote-db-$($env:ENVIRONMENT)"

          Write-Host "Usuwanie srodowiska: $($env:ENVIRONMENT)"
          Write-Host "Projekt Docker Compose: $project"

          docker compose `
            -f docker-compose-remote.yml `
            -p $project `
            down --volumes

          if ($LASTEXITCODE -ne 0) {
            throw "Nie udalo sie usunac kontenerow i wolumenu."
          }

      - name: Verify remaining containers
        shell: pwsh
        env:
          ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          $project = "remote-db-$($env:ENVIRONMENT)"

          $remaining = docker ps -a `
            --filter "label=com.docker.compose.project=$project" `
            --format "{{.Names}}"

          if ($LASTEXITCODE -ne 0) {
            throw "Nie udalo sie sprawdzic pozostalych kontenerow."
          }

          if ($remaining) {
            Write-Host "Pozostaly kontenery:"
            $remaining
            throw "Nadal istnieja kontenery dla $project."
          }

          Write-Host "OK: nie ma juz kontenerow dla $project."
